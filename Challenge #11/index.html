</head>

<body>

    <header>
        <nav class="menu">
            <ul>
                <li class="menu-item"><a href="#">Home</a></li>
                <li class="menu-item"><a href="#">Products</a>
                    <ul class="submenu">
                        <li><a href="#">Product 1</a></li>
                        <li><a href="#">Product 2</a></li>
                    </ul>
                </li>
                <li class="menu-item"><a href="#">Blogs</a></li>
                <li><a href="#">Cart</a></li>
            </ul>
            <button class="add-to-cart" data-name="Product 1" data-price="19.99">Add to Cart</button>

            <div id="cart-section">
                <h2>Shopping Cart</h2>
                <ul id="cart-items"></ul>
                <p>Total: $<span id="cart-total">0.00</span></p>
            </div>

        </nav>
    </header>

    <div class="content">
        <h1>Men's Wear Shop</h1>
        <p>Welcome to our fashion store!</p>
    </div>
    <div class="local-video">
        <h3>Welcome to Our Shop</h3>
        <p>Check out what fits on you in this video:</p>
        <video width="560" height="315" controls>
            <source src="How-To-Find-Your-Style.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <form action="action_page.php" method="post">
        <div class="imgcontainer">
            <img src="img_avatar2.png" alt="Avatar" class="avatar">
        </div>

        <div class="container">
            <label for="uname"><b>Username</b></label>
            <input type="text" placeholder="Enter Username" name="uname" required>

            <label for="psw"><b>Password</b></label>
            <input type="password" placeholder="Enter Password" name="psw" required>

            <button type="submit">Login</button>
            <label>
                <input type="checkbox" checked="checked" name="remember"> Remember me
            </label>
        </div>

        <div class="container" style="background-color:#f1f1f1">
            <button type="button" class="cancelbtn">Cancel</button>
            <span class="psw">Forgot <a href="#">password?</a></span>
        </div>
    </form>

    <button class="open-modal" onclick="document.getElementById('myModal').style.display='block'">Open Modal</button>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('myModal').style.display='none'">&times;</span>
            <p>This is a modal popup!</p>
        </div>
    </div>


</body>

</html>
